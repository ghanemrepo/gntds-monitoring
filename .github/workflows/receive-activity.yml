name: Log Activity

on:
  repository_dispatch:
    types: [activity-push, activity-pr]

concurrency:
  group: log-write
  cancel-in-progress: false  # queue, never drop

permissions:
  contents: write

jobs:
  log:
    name: Append to activity log
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Append entry
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          TS=$(echo '${{ github.event.client_payload.timestamp }}' | sed 's/T/ /' | cut -c1-16)
          REPO="${{ github.event.client_payload.source_repo }}"
          EVENT="${{ github.event.client_payload.event }}"

          if [ "$EVENT" = "push" ]; then
            BRANCH="${{ github.event.client_payload.branch }}"
            ACTOR="${{ github.event.client_payload.actor }}"
            SHA="${{ github.event.client_payload.commit_sha }}"
            MSG=$(echo '${{ github.event.client_payload.commit_msg }}' | head -c 80)
            URL="${{ github.event.client_payload.commit_url }}"
            LINE="| ${TS} | \`${REPO}\` | 📤 push | \`${BRANCH}\` | ${ACTOR} | [\`${SHA}\` ${MSG}](${URL}) |"
          else
            PR_NUM="${{ github.event.client_payload.pr_number }}"
            PR_TITLE=$(echo '${{ github.event.client_payload.pr_title }}' | head -c 80)
            PR_URL="${{ github.event.client_payload.pr_url }}"
            AUTHOR="${{ github.event.client_payload.author }}"
            MERGED="${{ github.event.client_payload.merged }}"
            BRANCH="${{ github.event.client_payload.branch }}"

            if [ "$MERGED" = "true" ]; then
              ICON="✅"
              LABEL="pr_merged"
            elif [ "$EVENT" = "pr_opened" ]; then
              ICON="🔀"
              LABEL="pr_opened"
            elif [ "$EVENT" = "pr_ready_for_review" ]; then
              ICON="👀"
              LABEL="ready_review"
            else
              ICON="🔁"
              LABEL="pr_closed"
            fi

            LINE="| ${TS} | \`${REPO}\` | ${ICON} ${LABEL} | [#${PR_NUM}](${PR_URL}) \`${BRANCH}\` | ${AUTHOR} | [${PR_TITLE}](${PR_URL}) |"
          fi

          echo "$LINE" >> logs/ACTIVITY_LOG.md

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/ACTIVITY_LOG.md
          git diff --staged --quiet && exit 0
          git commit -m "log(${{ github.event.client_payload.source_repo }}): ${{ github.event.client_payload.event }}"
          git pull --rebase origin main
          git push

name: Log Release

on:
  repository_dispatch:
    types: [activity-release]

concurrency:
  group: changelog-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  log:
    name: Append to changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Append changelog entry
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          REPO="${{ github.event.client_payload.source_repo }}"
          VERSION="${{ github.event.client_payload.version }}"
          NAME="${{ github.event.client_payload.release_name }}"
          URL="${{ github.event.client_payload.release_url }}"
          TS="${{ github.event.client_payload.released_at }}"

          printf "\n---\n\n## [%s %s](%s) — %s\n\n> Source repo: \`%s\` · Released: %s\n" \
            "$REPO" "$VERSION" "$URL" "$DATE" "$REPO" "$TS" >> changelogs/CHANGELOG.md

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add changelogs/CHANGELOG.md
          git diff --staged --quiet && exit 0
          git commit -m "changelog(${{ github.event.client_payload.source_repo }}): ${{ github.event.client_payload.version }}"
          git pull --rebase origin main
          git push
